name: NNUE recovery and geometry research
on:
  push:
    branches: [research/session-validation]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: official-stockfish/Stockfish
          ref: effdc3fd3f6de6e75fe1374a51a7a7eed66f880b
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: official-stockfish/Stockfish
          ref: effdc3fd3f6de6e75fe1374a51a7a7eed66f880b
          path: popcount
          persist-credentials: false
      - name: Prepare experiment and identical network
        run: |
          git -C popcount apply ../candidate/.github/research/h1-popcount.patch
          make -C baseline/src net
          cp baseline/src/nn-*.nnue candidate/src/
          cp baseline/src/nn-*.nnue popcount/src/
          mkdir -p results
          python --version
      - name: Linux builds
        if: runner.os == 'Linux'
        env:
          CXXFLAGS: -Werror
        run: |
          lscpu | tee results/cpu.txt
          g++ --version | tee results/compiler.txt
          make -C baseline/src -j4 build ARCH=x86-64-avx2 COMP=gcc
          make -C candidate/src -j4 build ARCH=x86-64-avx2 COMP=gcc
          make -C popcount/src -j4 build ARCH=x86-64-avx2 COMP=gcc
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - name: Windows builds
        if: runner.os == 'Windows'
        run: python candidate/.github/research/build_windows.py baseline/src candidate/src popcount/src
      - name: Record Windows CPU
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Out-File results/cpu.txt
      - name: Check loader failure and recovery
        run: |
          suffix=''
          if [ "$RUNNER_OS" = 'Windows' ]; then suffix='.exe'; fi
          python candidate/.github/research/probe_net_recovery.py "baseline/src/stockfish${suffix}" baseline/src/nn-c9e480e92425.nnue results/base-recovery | tee results/base-recovery.log
          python candidate/.github/research/probe_net_recovery.py "candidate/src/stockfish${suffix}" baseline/src/nn-c9e480e92425.nnue results/fixed-recovery --expect-fixed | tee results/fixed-recovery.log
      - name: Upstream regression suite
        run: |
          python -m pip install requests
          suffix=''
          if [ "$RUNNER_OS" = 'Windows' ]; then suffix='.exe'; fi
          cd candidate
          python tests/instrumented.py --none "src/stockfish${suffix}" > ../results/instrumented.log
          cat ../results/instrumented.log
      - name: Feature invariant audit
        run: |
          suffix=''
          if [ "$RUNNER_OS" = 'Windows' ]; then suffix='.exe'; fi
          python candidate/.github/research/build_feature_audit.py baseline/src candidate/.github/research/feature_audit.cpp "results/feature-audit${suffix}"
          "results/feature-audit${suffix}" candidate/.github/research/feature-seeds.fen 10000 20261020 > results/feature-audit.log
          tail -1 results/feature-audit.log
      - name: Check signatures and alternate benchmark order
        run: |
          suffix=''
          if [ "$RUNNER_OS" = 'Windows' ]; then suffix='.exe'; fi
          for directory in baseline candidate popcount; do
            "${directory}/src/stockfish${suffix}" bench > "results/${directory}-bench.stdout" 2> "results/${directory}-bench.log"
            python -c "import pathlib,re; s=pathlib.Path('results/${directory}-bench.log').read_text(); assert int(re.search(r'Nodes searched\s*:\s*(\d+)',s).group(1))==1559611"
          done
          python candidate/.github/research/compare_bench.py "baseline/src/stockfish${suffix}" "popcount/src/stockfish${suffix}" results/popcount-speed.json --depth 16 --pairs 20 | tee results/popcount-speed.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: session-${{ matrix.os }}
          path: results/
