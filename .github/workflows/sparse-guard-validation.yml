name: Sparse loop bounds research
on:
  push:
    branches: [research/sparse-guard-validation]
permissions:
  contents: read
concurrency:
  group: sparse-guard-validation
  cancel-in-progress: true
jobs:
  sparse:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: g++
          - os: windows-latest
            compiler: msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: matrix.compiler == 'msvc'
      - name: Compile proof and actual sparse layer
        run: python tests/research/sparse_guard/validate.py ${{ matrix.compiler }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sparse-${{ matrix.compiler }}
          path: validation-results/
          retention-days: 14
